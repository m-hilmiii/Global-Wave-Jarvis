name: Global Wave CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'
        cache-dependency-path: core_jarvis/whatsapp_bridge/package-lock.json

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx

    - name: Check Python Code Compilation
      run: |
        python -m compileall -q .

    - name: Build WhatsApp Baileys Bridge
      run: |
        cd core_jarvis/whatsapp_bridge
        npm ci
        npm run build

    - name: Run Test Suite (Isolated Mocks)
      run: |
        python -m unittest discover tests
